name: Product API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and start containers
        run: docker compose up -d --build

      - name: Wait for containers to be healthy
        run: |
          echo "Waiting for MongoDB and Product API..."

          for i in {1..30}; do
            MONGO_STATUS=$(docker inspect --format='{{.State.Health.Status}}' nammongodb 2>/dev/null || echo "starting")
            API_STATUS=$(docker inspect --format='{{.State.Health.Status}}' product-api 2>/dev/null || echo "starting")

            echo "MongoDB: $MONGO_STATUS | Product API: $API_STATUS"

            if [ "$MONGO_STATUS" = "healthy" ] && [ "$API_STATUS" = "healthy" ]; then
              echo "All containers are healthy!"
              exit 0
            fi

            sleep 2
          done

          echo "Containers did not become healthy in time."
          docker compose logs
          exit 1

      - name: Check Product API health
        run: |
          curl --fail http://localhost:3000/health
      - name: Test CREATE Product
        run: |
          curl --fail -X POST http://localhost:3000/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"P001","pname":"Laptop Lenovo","price":20000000,"quantity":10}'
      - name: Test READ Product
        run: |
          RESPONSE=$(curl --fail http://localhost:3000/products/P001)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep '"pid":"P001"'
          echo "$RESPONSE" | grep '"pname":"Laptop Lenovo"'
      - name: Test UPDATE Product
        run: |
          RESPONSE=$(curl --fail -X PUT http://localhost:3000/products/P001 \
            -H "Content-Type: application/json" \
            -d '{"price":18000000,"quantity":15}')

          echo "$RESPONSE"

          echo "$RESPONSE" | grep '"price":18000000'
          echo "$RESPONSE" | grep '"quantity":15'
      - name: Test DELETE Product
        run: |
          RESPONSE=$(curl --fail -X DELETE http://localhost:3000/products/P001)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep '"message":"Product deleted successfully"'

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/products/P001)

          if [ "$STATUS" != "404" ]; then
            echo "Product P001 was not deleted correctly"
            exit 1
          fi

          echo "Product P001 deleted successfully"
      - name: Stop containers
        if: always()
        run: docker compose down
